# The smallest agent configuration that answers a read-only v1/v2c
# query, with fixed identity fields so a test can assert on them
# instead of on whatever the build host happens to be called.
#
# `rocommunity public` grants read access to the whole tree under the
# community "public" (RFC 1157 community-based access).
rocommunity public

syslocation Hackathon Lab
syscontact dev@example.com
sysName moon-snmp-test-agent

# SNMPv3 users for the end-to-end tests. createUser writes the derived
# keys into the agent's persistent store on first start, which is how a
# v3 user is provisioned; the passwords are fixed so a test knows them.
#
# A user with no authentication at all, one that authenticates but does
# not encrypt, and one that does both.
createUser e2e-noauth
createUser e2e-md5 MD5 "md5authpass"
createUser e2e-sha SHA "shaauthpass"
createUser e2e-priv SHA "shaauthpass" AES "shaprivpass"

# The minimum security level each user is allowed to use. `rouser`
# grants read-only access; without it a user authenticates and then gets
# nothing.
rouser e2e-noauth noauth
rouser e2e-md5 auth
rouser e2e-sha auth
rouser e2e-priv priv
