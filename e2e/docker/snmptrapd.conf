# Accept notifications from anyone: the harness sends them from a
# container or a host process whose address is not known in advance, and
# there is nothing to protect in a throwaway test container.
#
# Without this, snmptrapd drops every notification as unauthorised.
disableAuthorization yes

# No output format is configured on purpose. The default format prints
# the version, the community and one line per var-bind with MIB names
# resolved, which is exactly what the CI greps for:
#
#   ... TRAP, SNMP v1, community public
#       NET-SNMP-MIB::netSnmp Enterprise Specific Trap (1101) ...
#
# A `format2` line would only apply to v2 notifications, so a v1 trap
# would fall back to a different formatter and the two would not look
# alike.

# The v3 user this fixture accepts notifications from. Two entries on
# purpose, because the authoritative engine differs by notification kind:
#
#   * an *inform* is authoritative for the receiving engine (this one),
#     so the key is localized to our own engine id — that is the plain
#     `createUser` line;
#   * a *trap* is authoritative for the sender's engine, so the key has
#     to be localized to the id the sender claims. `e2e/notify` pins that
#     id, and `-e` gives this entry the matching row.
#
# Without the second line, snmptrapd drops the trap as coming from an
# unknown engine — the signature cannot be checked otherwise.
createUser e2e-trap SHA "trappass" AES "trapprivpass"
createUser -e 0x80001F88046D6F6F6E2D736E6D702D74726170 e2e-trap SHA "trappass" AES "trapprivpass"
